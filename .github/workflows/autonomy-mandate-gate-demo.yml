name: Autonomy mandate candidate gate and Azure release

"on":
  pull_request:
    paths:
      - "controls/autonomy_and_human_oversight/**"
      - "schemas/governance-contract/**"
      - "policy/governance-contract/**"
      - "scripts/**"
      - ".github/workflows/autonomy-mandate-gate-demo.yml"
  workflow_dispatch:
    inputs:
      route:
        type: choice
        default: ci-only
        options: [ci-only, combined, policy-only]
        description: Local-equivalent gate, gated cloud release, or independent Policy experiment

permissions:
  contents: read

env:
  CANDIDATE: controls/autonomy_and_human_oversight/AUT-PRE-001_autonomy_boundary_undefined/candidate
  RUNTIME: controls/autonomy_and_human_oversight/AUT-002_irreversible_action_attempted

jobs:
  candidate-gate:
    if: github.event_name == 'pull_request' || inputs.route != 'policy-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt -r "$RUNTIME/requirements.txt" -r schemas/governance-contract/requirements.txt
      - name: Install pinned Conftest
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location -o conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.70.0/conftest_0.70.0_Linux_x86_64.tar.gz
          echo 'e738506fd808f7dc9794ce8e325f89b14932891a4841fe45f1f24c4a9bb3ed96  conftest.tar.gz' | sha256sum -c -
          tar xzf conftest.tar.gz conftest
          sudo mv conftest /usr/local/bin/
      - name: Gate the checked-out candidate without Azure credentials
        run: |
          set -euo pipefail
          bash scripts/deployment_gate.sh --manifest "$CANDIDATE/deployment-profile.yaml" --profile autonomy-mandate-review --root "$CANDIDATE" --evidence-out mandate-gate-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mandate-gate-evidence
          path: mandate-gate-evidence.json
          if-no-files-found: warn

  release:
    needs: candidate-gate
    if: github.event_name == 'workflow_dispatch' && inputs.route == 'combined'
    runs-on: ubuntu-latest
    environment: autonomy-mandate-demo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt -r "$RUNTIME/requirements.txt" -r schemas/governance-contract/requirements.txt
      - name: Mask private target identifiers before Azure login
        env:
          TARGET_CONFIGURATION: ${{ secrets.AUTONOMY_TARGET_CONFIGURATION }}
          TARGET_STATE: ${{ secrets.AUTONOMY_TARGET_STATE }}
        run: |
          python - <<'PY'
          import json, os
          for line in os.environ["TARGET_CONFIGURATION"].splitlines():
              if "=" in line:
                  value = line.split("=", 1)[1].strip()
                  if value:
                      print("::add-mask::" + value)
          def mask(value):
              if isinstance(value, str) and value:
                  print("::add-mask::" + value)
              elif isinstance(value, dict):
                  for nested in value.values():
                      mask(nested)
              elif isinstance(value, list):
                  for nested in value:
                      mask(nested)
          mask(json.loads(os.environ["TARGET_STATE"]))
          PY
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install Conftest for release-time revalidation
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location -o conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.70.0/conftest_0.70.0_Linux_x86_64.tar.gz
          echo 'e738506fd808f7dc9794ce8e325f89b14932891a4841fe45f1f24c4a9bb3ed96  conftest.tar.gz' | sha256sum -c -
          tar xzf conftest.tar.gz conftest
          sudo mv conftest /usr/local/bin/
      - name: Load private target configuration and gate the actual release
        env:
          TARGET_CONFIGURATION: ${{ secrets.AUTONOMY_TARGET_CONFIGURATION }}
          TARGET_STATE: ${{ secrets.AUTONOMY_TARGET_STATE }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNTIME/.azure"
          printf '%s' "$TARGET_CONFIGURATION" > "$RUNTIME/.azure/config.env"
          printf '%s' "$TARGET_STATE" > "$RUNTIME/.azure/deployment.json"
          python "$RUNTIME/infra/deploy.py" --release

  policy-denial-experiment:
    if: github.event_name == 'workflow_dispatch' && inputs.route == 'policy-only'
    runs-on: ubuntu-latest
    environment: autonomy-mandate-demo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt -r "$RUNTIME/requirements.txt"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Independent Policy denial, never authorize a normal release
        env:
          TARGET_STATE: ${{ secrets.AUTONOMY_TARGET_STATE }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNTIME/.azure"
          printf '%s' "$TARGET_STATE" > "$RUNTIME/.azure/deployment.json"
          python controls/autonomy_and_human_oversight/AUT-PRE-002_hitl_gates_missing/infra/azure_policy.py prove